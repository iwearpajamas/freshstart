version: 1

project:
  name: python-project

environment:
  image: python:3.12-slim
  workdir: /workspace
  allow_network: true

steps:
  - name: Install dependencies
    run:
      - python
      - -m
      - pip
      - install
      - -r
      - requirements.txt
    timeout_seconds: 300

  - name: Run example
    run:
      - python
      - main.py
    timeout_seconds: 60
